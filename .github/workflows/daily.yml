name: Daily paper update

on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:
    inputs:
      start_date:
        description: "Inclusive UTC start date, YYYY-MM-DD; blank means previous UTC day"
        required: false
        default: ""
      end_date:
        description: "Inclusive UTC end date, YYYY-MM-DD; blank means previous UTC day"
        required: false
        default: ""
      papers_per_topic:
        description: "Number of papers to select independently for each direction"
        required: false
        default: "5"
      topics_json:
        description: "JSON payload: {\"topics\":[...]}"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch papers
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-chat
          PAPER_START_DATE: ${{ github.event.inputs.start_date || '' }}
          PAPER_END_DATE: ${{ github.event.inputs.end_date || '' }}
          PAPER_PAPERS_PER_TOPIC: ${{ github.event.inputs.papers_per_topic || '5' }}
          PAPER_TOPICS_JSON: ${{ github.event.inputs.topics_json || '' }}
        run: |
          python scripts/fetch_papers.py \
            --start-date "$PAPER_START_DATE" \
            --end-date "$PAPER_END_DATE" \
            --papers-per-topic "$PAPER_PAPERS_PER_TOPIC"

      - name: Commit updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update daily papers"
          file_pattern: data/papers.json docs/papers.json docs/run_status.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
