<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daily Paper</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Paper directions">
        <div class="brand">
          <div>
            <h1>Daily Paper</h1>
            <p>Token pruning watchlist</p>
          </div>
          <button class="icon-button mobile-close" id="closeSidebar" aria-label="Close navigation">x</button>
        </div>

        <div class="search-box">
          <span>Search or add paper</span>
          <span class="search-input-row">
            <input id="searchInput" type="search" placeholder="title, arXiv link, PDF URL, author, keyword">
            <button class="icon-button add-paper-button" id="addPaperButton" type="button" title="Add paper" aria-label="Add paper">+</button>
          </span>
        </div>

        <div class="sidebar-tools">
          <button class="tool-button active" id="allButton" type="button">All papers</button>
          <button class="tool-button" id="highButton" type="button">High relevance</button>
        </div>

        <button class="wide-button" id="editTopicsButton" type="button">Edit directions</button>

        <nav id="topicTree" class="topic-tree"></nav>
      </aside>

      <main class="content">
        <header class="topbar">
          <button class="icon-button menu-button" id="openSidebar" aria-label="Open navigation">=</button>
          <div>
            <div class="eyebrow">Pure online paper tracker</div>
            <h2 id="viewTitle">All papers</h2>
          </div>
          <div class="status" id="statusText">Loading</div>
        </header>

        <section class="run-panel">
          <div class="run-grid">
            <label>
              <span>Range</span>
              <select id="lookbackDays">
                <option value="3">latest 3 days</option>
                <option value="7">7 days</option>
                <option value="14">14 days</option>
                <option value="30">30 days</option>
              </select>
            </label>
            <label>
              <span>Single date</span>
              <input id="targetDate" type="date">
            </label>
            <label>
              <span>Max results</span>
              <input id="maxResults" type="number" min="10" max="300" step="10" value="80">
            </label>
            <label>
              <span>Min score</span>
              <input id="minScore" type="number" min="0" max="100" step="1" value="18">
            </label>
          </div>
          <div class="token-row">
            <label class="token-field">
              <span id="tokenLabel">API key</span>
              <input id="apiToken" type="password" autocomplete="off">
            </label>
            <button class="link-button" id="saveTokenButton" type="button">Save key</button>
            <button class="link-button primary" id="runSearchButton" type="button">Run search</button>
          </div>
          <div class="token-help" id="tokenHelp"></div>
          <div class="run-status" id="runStatus">Run status will appear here.</div>
        </section>

        <section class="dashboard">
          <div class="metric">
            <span id="paperCount">0</span>
            <label>papers</label>
          </div>
          <div class="metric">
            <span id="topicCount">0</span>
            <label>directions</label>
          </div>
          <div class="metric">
            <span id="latestDate">-</span>
            <label>latest</label>
          </div>
        </section>

        <section class="detail" id="paperDetail">
          <div class="empty-state">
            <h3>Select a paper from the left</h3>
            <p>Expand a direction, choose a paper, and the summary plus links will appear here.</p>
          </div>
        </section>
      </main>
    </div>

    <dialog class="topic-dialog" id="topicDialog">
      <form method="dialog" class="topic-editor">
        <div class="dialog-head">
          <h3>Edit directions</h3>
          <button class="icon-button" value="cancel" aria-label="Close editor">x</button>
        </div>
        <div class="topic-editor-toolbar">
          <button class="tool-button" id="addTopicButton" type="button">
            <i data-lucide="plus" aria-hidden="true"></i>
            Add direction
          </button>
        </div>
        <div class="topic-edit-list" id="topicEditor"></div>
        <div class="topic-editor-status" id="topicEditorStatus" role="status"></div>
        <div class="dialog-actions">
          <button class="tool-button" id="resetTopicsButton" type="button">Reset</button>
          <button class="tool-button" id="copyTopicsButton" type="button">Copy JSON</button>
          <button class="tool-button active" id="saveTopicsButton" type="button">Save</button>
        </div>
      </form>
    </dialog>

    <dialog class="paper-dialog" id="paperDialog">
      <div class="paper-add-flow">
        <div class="dialog-head">
          <div>
            <div class="eyebrow">Add to library</div>
            <h3>Add paper</h3>
          </div>
          <button class="icon-button" id="closePaperDialog" type="button" aria-label="Close add paper dialog">x</button>
        </div>
        <div class="paper-add-status" id="paperAddStatus"></div>
        <div class="paper-candidates" id="paperCandidates"></div>
        <section class="paper-preview" id="paperPreview" hidden>
          <h4 id="paperPreviewTitle"></h4>
          <p class="authors" id="paperPreviewMeta"></p>
          <p id="paperPreviewSummary"></p>
          <div class="topic-choices" id="paperTopicChoices"></div>
        </section>
        <div class="dialog-actions">
          <button class="tool-button" id="cancelPaperAdd" type="button">Cancel</button>
          <button class="tool-button active" id="confirmPaperAdd" type="button" hidden>Add paper</button>
        </div>
      </div>
    </dialog>

    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.js"></script>
    <script src="app.js"></script>
  </body>
</html>
